<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Luigi Puzziferri · Mobile & Web Developer</title>
    <meta
      name="description"
      content="Portfolio di Luigi Puzziferri, Mobile e Web Developer: app mobile, frontend curato e interfacce chiare, utili e veloci."
    />
    <meta name="author" content="Luigi Puzziferri" />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Luigi Puzziferri · Mobile & Web Developer" />
    <meta
      property="og:description"
      content="App mobile, frontend curato e interfacce pensate per essere chiare, utili e veloci."
    />
    <meta property="og:url" content="https://luigip11.github.io/My-Portfolio/" />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
